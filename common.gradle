// common.gradle
// Use 'apply from: rootProject.file('common.gradle')' in your library build.gradle file

import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// Only Project and Settings build scripts can contain plugins {} blocks
apply plugin: 'com.google.devtools.ksp'

ext {
    // Common declarations goes here
}

android {
    compileSdk 37

    // Missing translations fall back to the default (English) string at runtime, and community
    // translations lag behind new strings. Keep reporting them, but do not fail lint on them.
    lint {
        warning 'MissingTranslation'
    }

    defaultConfig {
        minSdk 29
        targetSdk 37

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        // Was JavaVersion.current(), which silently tracked whatever JDK happened to run
        // Gradle (25 on newer setups) while Kotlin's jvmTarget below stayed pinned at 21 —
        // AGP then fails with "Inconsistent JVM targets" the moment those two drift apart.
        // Pinning both to 21 explicitly keeps them in lockstep regardless of the Gradle JDK.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_21)
        }
    }
}

dependencies {
    // Android Tools
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
